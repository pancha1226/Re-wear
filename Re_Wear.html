<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Re:Wear</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@700;800&display=swap">
<style>
/* Layout: hang-tag and care-label vernacular. Dashed "stitch" borders mark verification and price; one cobalt accent, green only for verified. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#15171C; --muted:#5C626D; --line:#D6D9D0; --tile:#E8EAE3;
  --accent:#1F4BFF; --accent-ink:#FFFFFF;
  --ok:#0F7A55; --ok-bg:#DDF2E8; --warn:#8F5600; --warn-bg:#FBEBC8; --bad:#B3261E; --bad-bg:#F9DDDA;
  --display:"Manrope","Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#181B21; --ink:#EEF0F3; --muted:#9AA1AD; --line:#2A2F38; --tile:#20242C;
  --accent:#7C98FF; --accent-ink:#0B1020;
  --ok:#5FD3A2; --ok-bg:#12332A; --warn:#F0B95A; --warn-bg:#3A2D10; --bad:#FF8F86; --bad-bg:#3C1815; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#181B21; --ink:#EEF0F3; --muted:#9AA1AD; --line:#2A2F38; --tile:#20242C;
  --accent:#7C98FF; --accent-ink:#0B1020;
  --ok:#5FD3A2; --ok-bg:#12332A; --warn:#F0B95A; --warn-bg:#3A2D10; --bad:#FF8F86; --bad-bg:#3C1815; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-bottom:48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 24px;padding-block:10px}
.logo{display:inline-flex;align-items:center;gap:9px;text-decoration:none}
.logo .mark{width:30px;height:30px;flex:none;display:block}
.logo .wm{font:800 24px/1 var(--display);letter-spacing:-.02em}
.logo .wm em{font-style:normal;color:var(--accent);font-family:var(--mono);font-weight:600;padding:0 1px}
nav{display:flex;gap:4px;order:3;flex-basis:100%;overflow-x:auto}
nav a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:14px;padding:6px 12px;border-radius:8px;color:var(--muted)}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
nav .n{display:inline-block;min-width:18px;margin-left:6px;padding:1px 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 11px/16px var(--mono);text-align:center}
.ctl{display:flex;gap:8px;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 9px;font:600 12px var(--mono)}
.seg svg{display:block;width:15px;height:15px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media(min-width:760px){nav{order:0;flex-basis:auto}}

/* hero */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:32px;align-items:center;padding-block:40px 28px}
.hero h1{font-size:clamp(30px,5vw,50px);letter-spacing:-.025em;margin-block:10px 14px}
.hero p.lead{max-width:52ch;color:var(--muted);font-size:16px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.label-card{background:var(--surface);border:1.5px dashed var(--ink);border-radius:6px;padding:20px;display:grid;gap:14px;position:relative}
.label-card::before{content:"";position:absolute;top:-9px;left:24px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1.5px dashed var(--ink)}
.label-card h2{font-size:17px}
.rows{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rows li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding-bottom:8px}
.rows li span:last-child{color:var(--ok);font-weight:600}
.rows li span:last-child::before{content:"✓ "}
.verdict{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.verdict strong{font:800 34px var(--display);letter-spacing:-.02em}

/* meter */
.meter{min-width:0}
.track{position:relative;height:8px;border-radius:99px;background:var(--tile)}
.track i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.track i.warn{background:var(--warn)} .track i.bad{background:var(--bad)}
.track b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.45}
.scale{position:relative;height:16px;margin-top:6px;font:11px var(--mono);color:var(--muted)}
.scale span{position:absolute;transform:translateX(-50%)}
.scale span:first-child{transform:none}
.note{font-size:13px;color:var(--muted)}

/* sections */
.section{padding-block:28px}
.section>h2,.head h2{font-size:clamp(24px,3.4vw,32px);letter-spacing:-.02em}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.tools input,.tools select{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-weight:600;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea{display:block;min-height:96px;resize:vertical;line-height:1.5}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:8px;font-size:16px}
.tools input{flex:1 1 200px;width:auto}.tools select{flex:0 1 220px;width:auto}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;min-width:0}
.card:hover{border-color:var(--accent)}
.art{background:var(--tile);aspect-ratio:1/1;display:grid;place-items:center;color:var(--ink)}
.art svg{width:62%;height:62%}
.cbody{display:grid;gap:6px;padding:12px 14px 14px;min-width:0}
.cbody h3{font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.price b{font:800 19px var(--display)}
.price small{font:12px var(--mono);color:var(--muted)}
.badge{justify-self:start;display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;border:1px dashed currentColor;border-radius:4px}
.badge.ok{color:var(--ok);background:var(--ok-bg)}
.badge.ex{color:var(--accent);background:var(--tile)}

/* forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>span{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:12px}
.slot{position:relative;display:grid;gap:6px;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.slot input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.slot .img{aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:8px;background:var(--tile) center/cover no-repeat;display:grid;place-items:center;font-size:12px}
.slot:focus-within .img{outline:2px solid var(--accent);outline-offset:2px}
.slot.filled .img{border-style:solid;border-color:var(--ok)}
.slot.filled .img span{display:none}
.pricebox{border:1.5px dashed var(--ink);border-radius:8px;padding:14px 16px;display:grid;gap:8px;margin-top:2px}
.pricebox div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.pricebox b{font:800 20px var(--display)}
.pricebox .you b{font-size:16px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.sellbar{display:flex;flex-wrap:wrap;align-items:end;gap:14px}
.sellbar .field{flex:0 1 220px}
.sellbar .btn{flex:1 1 220px}

/* ai result */
.run{display:grid;gap:12px;margin-top:18px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps li.done{color:var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
.steps li.done .dot{animation:none;border:0;background:var(--ok);position:relative}
.steps li.done .dot::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:var(--surface);font-size:11px;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.result{border-radius:10px;padding:16px;display:grid;gap:10px;border:1px solid currentColor}
.result.ok{background:var(--ok-bg);color:var(--ok)} .result.warn{background:var(--warn-bg);color:var(--warn)} .result.bad{background:var(--bad-bg);color:var(--bad)}
.result h3{font-size:19px}
.result p,.result li{color:var(--ink)}
.result ul{margin:0;padding-left:18px;display:grid;gap:2px}
.result .row{display:flex;flex-wrap:wrap;gap:10px}

/* how */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.cols .panel{display:grid;gap:8px;align-content:start}
.cols h3{font-size:18px}
.example{margin-top:16px;border:1.5px dashed var(--ink);border-radius:8px;padding:14px 16px;font-weight:600}

/* review */
.queue{display:grid;gap:16px}
.qitem{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumbs img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs .art{grid-column:1/-1;aspect-ratio:2/1;border-radius:6px}
.thumbs .art svg{height:70%}
.qinfo{display:grid;gap:10px;align-content:start;min-width:0}
.qinfo ul{margin:0;padding-left:18px;color:var(--ink)}
.qact{display:flex;flex-wrap:wrap;gap:10px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{position:relative;width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px}
.mclose{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:20px;margin-top:14px}
.mgrid>div{display:grid;gap:12px;align-content:start;min-width:0}
.mgrid .art{border-radius:10px}
.glist{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.glist li::before{content:"✓ ";color:var(--ok);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.big{font:800 28px var(--display);letter-spacing:-.02em}
.tl{list-style:none;margin:16px 0;padding:0;display:grid;gap:0}
.tl li{position:relative;padding:0 0 18px 30px;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.tl li::after{content:"";position:absolute;left:6px;top:20px;bottom:0;border-left:2px dashed var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--ink)}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.cur{color:var(--ink);font-weight:600}
.tl li.cur::before{border-color:var(--accent)}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:16px;align-items:end}
.filters .btn{padding:10px 12px}
.chat-head{display:flex;gap:12px;align-items:center;padding-right:76px}
.chat-head .art,.crow .art{width:56px;height:56px;aspect-ratio:auto;border-radius:8px;flex:none}
.chat-head .art svg,.crow .art svg{width:70%;height:70%}
.thread{display:grid;gap:8px;max-height:min(46vh,340px);overflow:auto;padding:4px 2px;margin:14px 0}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:14px;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.them{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg time{display:block;font:10px var(--mono);opacity:.7;margin-top:2px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0}
.clist{display:grid;gap:10px}
.crow{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.crow:hover{border-color:var(--accent)}
.crow .t{min-width:0;flex:1}
.crow p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.udot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.cw{position:relative;display:flex;min-width:0}
.cw .card{width:100%}
.fav{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0}
.fav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.fav[aria-pressed=true]{color:var(--bad)}
.fav[aria-pressed=true] svg{fill:currentColor}
.art.ph{overflow:hidden}
.art.ph img{width:100%;height:100%;object-fit:cover;display:block}
.gthumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.gt{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);aspect-ratio:1/1}
.gt img{width:100%;height:100%;object-fit:cover;display:block}
.rate{font:12px var(--mono);color:var(--muted)}
.badge.sd{color:var(--warn);background:var(--warn-bg)}
.stars{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.star{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:20px;color:var(--warn);padding:0}
.star:hover{border-color:var(--accent)}
.mrow{display:grid;grid-template-columns:88px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.mrow .art{width:88px;height:88px;aspect-ratio:auto;border-radius:8px}
.minfo{display:grid;gap:6px;min-width:0;align-content:start}
.minfo h3{font-size:16px}
.mact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mact .pin{width:110px;padding:8px 10px}
.mact .btn{padding:8px 12px;font-size:14px}
.modal h2{padding-right:72px}
.acct{display:flex;align-items:center;gap:8px}
.who{font-weight:600;font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl{flex-wrap:wrap;align-items:center}
.ctl .btn{padding:5px 12px;font-size:13px}
.gate{border:1.5px dashed var(--ink);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.authform{display:grid;gap:14px;margin-top:6px}
.phone{display:flex}
.phone .pre{padding:10px 12px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:var(--tile);font:600 14px var(--mono);display:grid;align-items:center}
.phone input{border-radius:0 8px 8px 0;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;flex:none}
.demo{border:1.5px dashed var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}
.consent{position:fixed;inset:0;z-index:100;background:rgba(10,12,16,.74);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cbox{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:560px;max-height:100%;overflow:auto;display:grid;gap:14px}
.cbox h2{font-size:24px}
.cl{display:flex;justify-content:flex-end}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:600;font-size:16px;text-align:left}
footer .linkbtn{font-size:14px;justify-self:start}
.cstext{display:grid;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:12px;max-height:260px;overflow:auto;font-size:14px;color:var(--ink)}
.paym{display:flex;gap:12px;align-items:center;border:1.5px solid var(--accent);border-radius:8px;padding:12px}
.paym .radio{width:16px;height:16px;border-radius:50%;border:5px solid var(--accent);flex:none}
.rows li{justify-content:flex-start;gap:10px}
.rows li span:last-child{color:inherit;font-weight:500}
.rows li span:last-child::before{content:none}
.rows li::before{content:"\2713";color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);margin-top:24px;padding-block:20px;display:grid;gap:6px}
</style>

<header class="top"><div class="wrap bar">
  <a class="logo" href="#catalog" aria-label="Re:Wear"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" style="fill:var(--accent)"/><g transform="translate(0 2.7)" style="fill:none;stroke:var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11.2V10a2.4 2.4 0 1 0-2.4-2.4"/><path d="M16 11.2 6.4 18.4a1.6 1.6 0 0 0 .9 2.9h17.4a1.6 1.6 0 0 0 .9-2.9L16 11.2Z"/></g></svg><span class="wm">Re<em>:</em>Wear</span></a>

pay_secure_p:["Здесь будет страница платёжного сервиса. Данные карты вводятся только на ней: Re:Wear их не получает и не хранит. В демо ничего вводить не нужно.","Aici va fi pagina serviciului de plată. Datele cardului se introduc doar acolo: Re:Wear nu le primește și nu le păstrează. În demo nu trebuie să introduci nimic.","The payment service page will be here. Card details are entered only there: Re:Wear never receives or stores them. Nothing needs to be entered in this demo."],

pay_cancel:["Отмена","Anulează","Cancel"],
cs_p1:["Re:Wear — площадка-посредник между продавцами и покупателями. Мы не продаём вещи сами и не являемся их владельцем, производителем или продавцом.","Re:Wear este o platformă intermediară între vânzători și cumpărători. Nu vindem articolele noi înșine și nu suntem proprietarul, producătorul sau vânzătorul lor.","Re:Wear is an intermediary platform between sellers and buyers. We do not sell items ourselves and are not their owner, manufacturer or seller."],
cs_p2:["Продавец отвечает за вещь, её описание, состояние и подлинность. Re:Wear не несёт ответственности за товар.","Vânzătorul răspunde pentru articol, descrierea, starea și autenticitatea lui. Re:Wear nu poartă răspundere pentru produs.","The seller is responsible for the item, its description, condition and authenticity. Re:Wear is not responsible for the goods."],
cs_p3:["Единственное исключение — «Гарантия покупки»: при оплате через Re:Wear деньги удерживаются до получения заказа, на осмотр даётся 3 дня, и при несоответствии описанию покупателю возвращается вся сумма.","Singura excepție este «Garanția cumpărăturii»: la plata prin Re:Wear banii sunt reținuți până la primirea comenzii, ai 3 zile pentru verificare, iar dacă articolul nu corespunde descrierii, cumpărătorului i se returnează întreaga sumă.","The only exception is the «Purchase guarantee»: when you pay through Re:Wear the money is held until you receive the order, you have 3 days to inspect it, and if the item does not match the description, the buyer is refunded in full."],
cs_p4:["Сделки и оплата вне Re:Wear не защищены гарантией. Платите только через сайт.","Tranzacțiile și plățile în afara Re:Wear nu sunt protejate de garanție. Plătește doar prin site.","Deals and payments outside Re:Wear are not covered by the guarantee. Pay only through the site."],
cs_p5:["Для регистрации мы просим имя и номер телефона (Молдова или ПМР) и подтверждаем номер SMS-кодом. Номер нужен для входа и защиты от мошенников и другим пользователям не показывается. Данные банковской карты Re:Wear не получает и не хранит: оплата проходит на стороне платёжного сервиса.","Pentru înregistrare cerem numele și numărul de telefon (Moldova sau Transnistria) și confirmăm numărul prin cod SMS. Numărul este necesar pentru autentificare și protecție împotriva fraudei și nu este afișat altor utilizatori. Re:Wear nu primește și nu păstrează datele cardului bancar: plata se face la serviciul de plată.","To register we ask for your name and phone number (Moldova or Transnistria) and confirm the number with an SMS code. The number is used for login and fraud protection and is not shown to other users. Re:Wear does not receive or store bank card details: payment is handled by the payment service."],
cs_p6:["Мы можем заблокировать аккаунт и снять объявление при подозрении на мошенничество или подделку.","Putem bloca contul și retrage anunțul în caz de suspiciune de fraudă sau contrafacere.","We may block an account and remove a listing if fraud or counterfeiting is suspected."],

/* ---------- registration ---------- */
var DB=null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function gateHTML(){return '<p class="muted">'+t("au_need")+'</p><button class="btn primary" style="margin-top:10px" type="button" data-login>'+t("login")+'</button>'}
function regionName(r){return r==="pmr"?t("pmr"):t("rg_md")}
function maskNum(n){return "+373 •••••"+n.slice(-3)}
function normPhone(v){
 var d=String(v).replace(/\D/g,"");
 if(d.length===11&&d.indexOf("373")===0)d=d.slice(3);
 else if(d.length===9&&d.charAt(0)==="0")d=d.slice(1);
 if(/^77\d{6}$/.test(d))return {num:d,region:"pmr"};
 if(/^(6\d|7[89])\d{6}$/.test(d))return {num:d,region:"md"};
 return null;
}
function regionOf(raw){
 var d=String(raw).replace(/\D/g,"");
 if(d.indexOf("373")===0)d=d.slice(3);else if(d.charAt(0)==="0")d=d.slice(1);
 if(/^77/.test(d))return "pmr";
 if(/^(6|7[89])/.test(d))return "md";
 return "";
}
function regionHint(raw){var r=regionOf(raw);return r?t("au_region",{r:regionName(r)}):t("au_phone_hint")}
function genCode(){return String(Math.floor(100000+Math.random()*900000))}
function hashPhone(ph){
 var str="rewear:"+ph;
 if(window.crypto&&window.crypto.subtle&&window.TextEncoder){
  return window.crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(function(b){
   return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("").slice(0,32);
  });
 }
 var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;
 return Promise.resolve("x"+h.toString(16));
}
async function accGet(key){
 if(DB){try{var snap=await DB.doc("accounts/"+key).get();if(snap.exists)return snap.data()}catch(e){}}
 var raw=lsGet("rw-acc-"+key);
 if(raw){try{return JSON.parse(raw)}catch(e){}}
 return null;
}
async function accPut(key,acc){
 lsSet("rw-acc-"+key,JSON.stringify(acc));
 if(DB){try{await DB.doc("accounts/"+key).set(acc)}catch(e){}}
}

 $("#sellGate").hidden=!!S.user;

function phoneField(a){

 return '<label class="field"><span>'+t("au_phone")+'</span><div class="phone"><span class="pre">+373</span><input id="auPhone" type="text" inputmode="numeric" autocomplete="tel-national" maxlength="20" placeholder="6X XXX XXX" value="'+esc(raw)+'"></div></label><p class="note" id="auRegion">'+regionHint(raw)+'</p>';
}
function authHTML(){
 var a=S.auth||{mode:"reg"},err=a.err?'<p class="err" role="alert">'+t(a.err)+'</p>':'<p class="err"></p>';
 if(a.mode==="code"){
  return '<h2>'+t("au_code_t")+'</h2><p class="muted" style="margin-top:6px">'+t("au_code_p",{p:maskNum(a.num)})+'</p><form class="authform" data-auth="code"><p class="demo">'+t("au_demo",{c:a.code})+'</p><label class="field"><span>'+t("au_code_ph")+'</span><input id="auCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>'+err+'<button class="btn primary" type="submit">'+t("au_code_btn")+'</button><div class="qact"><button class="btn" type="button" data-act="resend">'+t("au_resend")+'</button><button class="btn" type="button" data-act="aback">'+t("au_back")+'</button></div></form>';
 }
 var reg=a.mode!=="login";
 var tabs='<div class="seg" style="margin:10px 0 4px"><button type="button" data-act="authtab" data-m="reg" aria-pressed="'+reg+'">'+t("register")+'</button><button type="button" data-act="authtab" data-m="login" aria-pressed="'+!reg+'">'+t("login")+'</button></div>';
 if(reg)return '<h2>'+t("register")+'</h2>'+tabs+'<p class="note">'+t("au_why")+'</p><form class="authform" data-auth="reg"><label class="field"><span>'+t("au_name")+'</span><input id="auName" type="text" autocomplete="name" maxlength="40" value="'+esc(a.name||"")+'"></label>'+phoneField(a)+err+'<button class="btn primary" type="submit">'+t("au_reg_btn")+'</button></form>';
 return '<h2>'+t("login")+'</h2>'+tabs+'<form class="authform" data-auth="login">'+phoneField(a)+err+'<button class="btn primary" type="submit">'+t("au_reg_btn")+'</button></form>';
}
function openAuth(cb){
 S.afterAuth=cb||null;S.auth={mode:"reg"};
 if($("#overlay").hidden)openModal(authHTML);else setModal(authHTML);
}
function requireAuth(cb){if(S.user)cb(false);else openAuth(function(){cb(true)})}
function finishAuth(key,acc,silent){
 var id="u"+key.slice(0,12);
 S.user={id:id,key:key,name:acc.name,region:acc.region,mask:acc.mask};
 if(!SELLERS[id])SELLERS[id]={name:acc.name,sum:0,count:0};
 lsSet("rw-session",key);
 updateAcct();renderAll();
 if(silent)return;
 S.auth=null;var cb=S.afterAuth;S.afterAuth=null;
 closeModal();showToast(t("au_welcome",{n:acc.name}));
 if(cb)cb();
}
async function authSubmit(kind){
 if(kind==="code")return verifyCode();
 var a=S.auth||(S.auth={mode:kind}),raw=$("#auPhone").value;
 a.phoneRaw=raw;a.mode=kind;
 if(kind==="reg"){a.name=$("#auName").value.trim();if(a.name.length<2){a.err="au_err_name";setModal(authHTML);return}}
 var ph=normPhone(raw);
 if(!ph){a.err="au_err_ph";setModal(authHTML);return}
 var key=await hashPhone(ph.num),ex=await accGet(key);
 if(kind==="reg"&&ex){a.err="au_err_dup";setModal(authHTML);return}
 if(kind==="login"&&!ex){a.err="au_err_nouser";setModal(authHTML);return}
 S.auth={mode:"code",kind:kind,name:kind==="reg"?a.name:ex.name,phoneRaw:raw,num:ph.num,region:ph.region,key:key,acc:ex,code:genCode(),tries:0,sends:1,locked:false,err:""};
 setModal(authHTML);
 var c=$("#auCode");if(c)c.focus();
}
async function verifyCode(){
 var a=S.auth,v=$("#auCode").value.trim();
 if(a.locked){a.err="au_err_lock";setModal(authHTML);return}
 if(v!==a.code){
  a.tries++;
  if(a.tries>=3){if(a.sends>=5){a.locked=true;a.err="au_err_lock"}else{a.sends++;a.code=genCode();a.tries=0;a.err="au_err_code3"}}
  else a.err="au_err_code";
  setModal(authHTML);return;
 }
 var acc=a.acc;
 if(a.kind==="reg"){
  acc={name:a.name,region:a.region,mask:maskNum(a.num),createdAt:Date.now(),consentAt:S.consentAt||Date.now()};
  await accPut(a.key,acc);
 }
 finishAuth(a.key,acc,false);
}
function doLogout(){
 S.user=null;S.chats={};S.order=null;S.afterAuth=null;lsSet("rw-session","");
 if(!$("#overlay").hidden)closeModal();
 updateAcct();renderAll();showToast(t("au_bye"));
}
async function restoreSession(){
 if(S.user)return;
 var key=lsGet("rw-session");if(!key)return;
 var acc=await accGet(key);
 if(acc&&!S.user)finishAuth(key,acc,true);
}
function initDb(){
 try{if(window.claude&&typeof window.claude.use==="function")window.claude.use("db").then(function(d){DB=d;restoreSession()},function(){})}catch(e){}
}

 var msgs=th.msgs.length?th.msgs.map(function(m){return '<div class="msg '+(m.me?"me":"them")+'">'+esc(m.text)+'<time>'+tm(m.ts)+'</time></div>'}).join(""):'<p class="note">'+t("chat_empty")+'</p>';
 var quick=[1,2,3,4].map(function(i){return '<button type="button" class="chip" data-act="quick" data-i="'+i+'">'+t("cq"+i)+'</button>'}).join("");
 return '<div class="chat-head"><div class="art">'+art(p.type,p.color)+'</div><div style="min-width:0"><h2 style="font-size:18px">'+ttl(p)+'</h2><p class="meta">'+esc(sname(p.seller))+' · '+ratingText(p.seller)+' · '+cityName(p.city)+' · '+money(buyer(p.price))+'</p></div></div>'+
 '<div class="thread" id="thread">'+msgs+'</div><div class="quick">'+quick+'</div>'+
 '<form class="cform" data-chat="'+p.id+'"><input id="chatInput" type="text" autocomplete="off" maxlength="300" placeholder="'+esc(t("chat_ph"))+'"><button class="btn primary" type="submit">'+t("send")+'</button></form>'+
 '<p class="note" style="margin-top:10px">'+t("chat_safe")+' '+t("chat_demo")+'</p>'+
 '<button class="btn" style="margin-top:10px" data-act="toprod" data-id="'+p.id+'">'+t("to_prod")+'</button>';
}
function scrollThread(){var el=$("#thread");if(el)el.scrollTop=el.scrollHeight}
function openChat(p,inModal){
 thread(p.id).unread=0;renderChats();
 if(!inModal)lastFocus=document.activeElement;
 setModal(function(){return chatHTML(p)},p.id);scrollThread();
 var n=$("#chatInput");if(n)n.focus();
}
function refreshChat(id){
 var inp=$("#chatInput"),v=inp?inp.value:"",foc=!!inp&&document.activeElement===inp;
 setModal(function(){return chatHTML(find(id))},id);scrollThread();
 var n=$("#chatInput");if(n){n.value=v;if(foc)n.focus()}
}
function sendMsg(id,text,key){
 text=(text||"").trim();if(!text)return;
 var th=thread(id);th.msgs.push({me:1,text:text,ts:Date.now()});
 refreshChat(id);var n=$("#chatInput");if(n){n.value="";n.focus()}
 renderChats();
 setTimeout(function(){
  th.msgs.push({me:0,text:t(key||"ca0"),ts:Date.now()});
  if(S.chatOpen===id)refreshChat(id);else{th.unread++;showToast(t("new_msg"))}
  renderChats();
 },1300);
}
function renderChats(){
 if(!S.user){$("#cn").hidden=true;$("#clist").innerHTML=gateHTML();return}
 var ids=Object.keys(S.chats).filter(function(k){return S.chats[k].msgs.length&&find(k)});
 ids.sort(function(a,b){var x=S.chats[a].msgs,y=S.chats[b].msgs;return y[y.length-1].ts-x[x.length-1].ts});
 var n=ids.filter(function(k){return S.chats[k].unread>0}).length;
 $("#cn").textContent=n;$("#cn").hidden=!n;
 $("#clist").innerHTML=ids.length?ids.map(function(k){
  var p=find(k),m=S.chats[k].msgs,last=m[m.length-1];
  return '<button class="crow" data-chat="'+k+'"><div class="art">'+art(p.type,p.color)+'</div><div class="t"><h3 style="font-size:15px">'+ttl(p)+'</h3><p class="muted">'+esc(last.text)+'</p></div>'+(S.chats[k].unread?'<span class="udot"></span>':'')+'</button>';
 }).join(""):'<p class="muted">'+t("chats_empty")+'</p>';
}

/* ---------- misc ---------- */
var toastT;
function showToast(m){var el=$("#toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},2600)}
var VIEWS=["catalog","sell","mine","favs","chats","how"];
function route(){
 var h=location.hash.slice(1);if(VIEWS.indexOf(h)<0&&h!=="grid-top")h="catalog";
 var v=h==="grid-top"?"catalog":h;
 VIEWS.forEach(function(n){$("#v-"+n).hidden=n!==v});
 $$("#nav a").forEach(function(a){if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 if(h!=="grid-top")window.scrollTo(0,0);
}

/* ---------- events ---------- */
["#langSeg","#csLang"].forEach(function(sel){$(sel).addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;L=LANGS.indexOf(b.dataset.lang);try{localStorage.setItem("rw-lang",b.dataset.lang)}catch(x){}applyI18n()})});
$("#themeSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;document.documentElement.setAttribute("data-theme",b.dataset.theme);try{localStorage.setItem("rw-theme",b.dataset.theme)}catch(x){}$$("#themeSeg button").forEach(function(c){c.setAttribute("aria-pressed",String(c===b))})});
$("#curSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;CUR=b.dataset.cur;S.fmin=0;S.fmax=0;$("#fMin").value="";$("#fMax").value="";try{localStorage.setItem("rw-cur",CUR)}catch(x){}applyI18n()});
$("#q").addEventListener("input",function(e){S.q=e.target.value.trim();renderCatalog()});
$("#sort").addEventListener("change",function(e){S.sort=e.target.value;renderCatalog()});
$("#chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;S.cat=b.dataset.cat;$$(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c===b))});renderCatalog()});
function gridClick(e){
 var f=e.target.closest(".fav");if(f){toggleFav(+f.dataset.fav);return}
 var c=e.target.closest(".card");if(!c)return;var p=find(c.dataset.id);openModal(function(){return productHTML(p)});
}
$("#grid").addEventListener("click",gridClick);
$("#favgrid").addEventListener("click",gridClick);
$("#mine").addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;
 var a=b.dataset.act,id=+b.dataset.id,p=find(id);
 if(a==="saveprice"&&p){var v=Math.round(parseFloat($("#pin"+id).value)||0);if(v>0){p.price=v;showToast(t("price_saved"));renderAll()}}
 else if(a==="sold"&&p){
  p.sold=true;S.delAsk=null;showToast(t("st_sold"));renderAll();
  if(!p.rated){p.rated=true;var uid=me();setTimeout(function(){var n=Math.random()<0.3?4:5;if(SELLERS[uid]){SELLERS[uid].sum+=n;SELLERS[uid].count++}showToast(t("rated_me",{n:n}));renderAll()},1600)}
 }
 else if(a==="relist"&&p){p.sold=false;renderAll()}
 else if(a==="del"&&p){
  if(S.delAsk===id){S.products=S.products.filter(function(x){return x.id!==id});S.favs=S.favs.filter(function(x){return x!==id});S.delAsk=null;showToast(t("removed"))}else S.delAsk=id;
  renderAll();
 }
});
$("#price").addEventListener("input",updatePrice);
$$(".slot input").forEach(function(inp){inp.addEventListener("change",function(){
 var f=inp.files&&inp.files[0],slot=inp.closest(".slot"),i=+inp.dataset.slot;
 if(!f){S.photos[i]=null;slot.classList.remove("filled");slot.querySelector(".img").style.backgroundImage="";return}
 var u=URL.createObjectURL(f);S.photos[i]=u;slot.classList.add("filled");slot.querySelector(".img").style.backgroundImage='url("'+u+'")';
})});
$("#form").addEventListener("submit",function(e){
 e.preventDefault();if(S.busy)return;
 if(!S.user){openAuth(function(){$("#submit").click()});return}
 var f={brand:$("#brand").value.trim(),type:$("#type").value,size:$("#size").value.trim(),cond:$("#cond").value,gender:$("#gender").value,city:$("#scity").value,price:parseFloat($("#price").value)||0,desc:$("#desc").value.trim(),photos:S.photos.slice()};
 if(!f.size||f.price<=0||!S.photos[0]){$("#err").textContent=t("err_fields");return}
 $("#err").textContent="";publishListing(f);
});
$("#modalBody").addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act;
 if(a==="fav"){toggleFav(+b.dataset.id);var fb=$("#favBtn");if(fb)fb.textContent=t(S.favs.indexOf(+b.dataset.id)>-1?"fav_del":"fav_add")}
 else if(a==="photo"){var mp=$("#mainPhoto");if(mp)mp.src=b.dataset.src}
 else if(a==="rate"){rateSeller(+b.dataset.n)}
 else if(a==="authtab"){S.auth={mode:b.dataset.m};setModal(authHTML)}
 else if(a==="resend"){var A=S.auth;if(A.sends>=5){A.locked=true;A.err="au_err_lock"}else{A.sends++;A.code=genCode();A.tries=0;A.err=""}setModal(authHTML)}
 else if(a==="aback"){S.auth={mode:S.auth.kind==="login"?"login":"reg",name:S.auth.name,phoneRaw:S.auth.phoneRaw};setModal(authHTML)}
 else if(a==="chat"){var cid=b.dataset.id;requireAuth(function(fresh){openChat(find(cid),!fresh)})}
 else if(a==="quick"){sendMsg(S.chatOpen,t("cq"+b.dataset.i),"ca"+b.dataset.i)}
 else if(a==="toprod"){var pp=find(b.dataset.id);setModal(function(){return productHTML(pp)})}
 else if(a==="buy"){var p=find(b.dataset.id);requireAuth(function(fresh){var fn=function(){return checkoutHTML(p)};if(fresh)openModal(fn);else setModal(fn)})}
 else if(a==="pay"){
  var n=$("#coName").value.trim(),ph=$("#coPhone").value.trim();
  if(!n||ph.length<6){$("#coErr").textContent=t("co_err");return}
  S.pending={p:find(b.dataset.id),name:n,phone:ph,city:$("#coCity").value};setModal(payHTML);
 }
 else if(a==="paydone"){S.order={p:S.pending.p,stage:0};S.pending=null;setModal(trackerHTML)}
 else if(a==="paycancel"){var cp=find(b.dataset.id);setModal(function(){return checkoutHTML(cp)})}
 else if(a==="ship"){S.order.stage=1;setModal(trackerHTML)}
 else if(a==="recv"){S.order.stage=2;setModal(trackerHTML)}
 else if(a==="ok"){S.order.stage=3;S.order.p.sold=true;setModal(trackerHTML);renderAll()}
 else if(a==="bad"){S.order.stage=4;setModal(trackerHTML)}
});
function fSync(){
 S.fg=$("#fGender").value;S.fs=$("#fSize").value.trim().toLowerCase();
 var k=CUR==="PRB"?RATE:1;S.fmin=(parseFloat($("#fMin").value)||0)/k;S.fmax=(parseFloat($("#fMax").value)||0)/k;renderCatalog();
}
["fGender"].forEach(function(i){$("#"+i).addEventListener("change",fSync)});
["fSize","fMin","fMax"].forEach(function(i){$("#"+i).addEventListener("input",fSync)});
$("#fReset").addEventListener("click",function(){$("#fGender").value="all";["fSize","fMin","fMax"].forEach(function(i){$("#"+i).value=""});fSync()});
$("#modalBody").addEventListener("submit",function(e){
 var f=e.target.closest("[data-chat]");
 if(f){e.preventDefault();sendMsg(+f.dataset.chat,$("#chatInput").value);return}
 var au=e.target.closest("[data-auth]");if(!au)return;
 e.preventDefault();authSubmit(au.dataset.auth);
});
document.addEventListener("click",function(e){
 if(e.target.closest("[data-login]")){openAuth();return}
 if(e.target.closest("#logout"))doLogout();
});
$("#clist").addEventListener("click",function(e){var r=e.target.closest(".crow");if(!r)return;openChat(find(r.dataset.chat),false)});
$("#modalBody").addEventListener("input",function(e){if(e.target.id==="auPhone"){var n=$("#auRegion");if(n)n.textContent=regionHint(e.target.value)}});
$("#csLink").addEventListener("click",function(){var open=$("#csText").hidden;$("#csText").hidden=!open;this.setAttribute("aria-expanded",String(open))});
$("#csBox").addEventListener("change",function(){$("#csBtn").disabled=!this.checked});
$("#csBtn").addEventListener("click",function(){if(!$("#csBox").checked)return;S.consentAt=Date.now();lsSet("rw-consent","1");lsSet("rw-consent-at",String(S.consentAt));setGate(false)});
$("#csOpen").addEventListener("click",function(){openModal(function(){return '<h2>'+t("cs_title")+'</h2><div class="cstext" style="margin-top:12px;max-height:none">'+policyParas()+'</div>'})});
$("#mclose").addEventListener("click",closeModal);
$("#overlay").addEventListener("click",function(e){if(e.target.id==="overlay")closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#overlay").hidden)closeModal()});
window.addEventListener("hashchange",route);

applyI18n();route();initConsent();restoreSession();initDb();
})();
